name: KVPV regression tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Node 24 - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Simulate Windows Git CRLF checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -File -Include '*.js','*.cjs' | ForEach-Object {
            $text = [IO.File]::ReadAllText($_.FullName)
            $crlf = [Regex]::Replace($text, '\r?\n', "`r`n")
            if ($text -cne $crlf) {
              [IO.File]::WriteAllText($_.FullName, $crlf, [Text.UTF8Encoding]::new($false))
            }
          }
      - name: Build bundles
        run: node build.cjs
      # test.cjs is the canonical suite and contains the existing regression tests.
      # Do not invoke retired or absent standalone test filenames.
      - name: Full project test suite
        run: node test.cjs
