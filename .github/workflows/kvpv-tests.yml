name: KVPV regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Full regression and public-to-owner result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set +e
          node test.cjs > "$RUNNER_TEMP/kvpv-test.log" 2>&1
          code=$?
          tail -n 100 "$RUNNER_TEMP/kvpv-test.log"
          if [ "${{ github.event_name }}" = "push" ]; then
            {
              echo "Commit: ${{ github.sha }}"
              echo "Runner: Node $(node -v)"
              echo "Exit code: $code"
              echo
              echo '~~~'
              tail -n 110 "$RUNNER_TEMP/kvpv-test.log"
              echo '~~~'
            } > "$RUNNER_TEMP/kvpv-report.md"
            gh issue create --repo "${{ github.repository }}" --title "[KVPV CI] ${{ github.sha }}" --body-file "$RUNNER_TEMP/kvpv-report.md" || true
          fi
          exit "$code"
      - name: Build FULL only after tests pass
        if: success()
        run: |
          node build.cjs
          node --check KVPV_V1_FULL.js
          node --check KVPV_SCAN_LIVE_PATCH.js
      - name: Upload verified FULL and live patch
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KVPV-verified-full-${{ github.sha }}
          path: |
            KVPV_V1_FULL.js
            KVPV_SCAN_LIVE_PATCH.js
            MANIFEST.json
          if-no-files-found: error
          retention-days: 14
